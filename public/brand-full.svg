<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs>
    <pattern id="dots" x="0" y="0" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="rgba(251,191,36,0.12)"/>
    </pattern>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#030712" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="circle">
      <circle cx="540" cy="540" r="540"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <circle cx="540" cy="540" r="540" fill="#030712"/>

  <!-- Dot grid -->
  <rect width="1080" height="1080" fill="url(#dots)" clip-path="url(#circle)"/>

  <!-- Glow center -->
  <circle cx="540" cy="540" r="540" fill="url(#glow)"/>

  <!-- Outer ring -->
  <circle cx="540" cy="540" r="500" fill="none" stroke="#f59e0b" stroke-width="1.5" stroke-opacity="0.25"/>
  <circle cx="540" cy="540" r="490" fill="none" stroke="#f59e0b" stroke-width="0.5" stroke-opacity="0.12"/>

  <!-- Corner brackets top-left -->
  <path d="M 300 300 L 300 360 M 300 300 L 360 300" stroke="#f59e0b" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.6"/>
  <!-- Corner brackets top-right -->
  <path d="M 780 300 L 780 360 M 780 300 L 720 300" stroke="#f59e0b" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.6"/>
  <!-- Corner brackets bottom-left -->
  <path d="M 300 780 L 300 720 M 300 780 L 360 780" stroke="#f59e0b" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.6"/>
  <!-- Corner brackets bottom-right -->
  <path d="M 780 780 L 780 720 M 780 780 L 720 780" stroke="#f59e0b" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.6"/>

  <!-- @ symbol -->
  <text x="540" y="420" font-family="'Courier New', monospace" font-size="60" font-weight="700" fill="#f59e0b" text-anchor="middle" opacity="0.4">@</text>

  <!-- Main text: AT_NETTO.TECH -->
  <text x="540" y="580" font-family="'Courier New', monospace" font-size="108" font-weight="700" fill="#f8fafc" text-anchor="middle" letter-spacing="2">AT_NETTO<tspan fill="#f59e0b">.TECH</tspan></text>

  <!-- Divider line -->
  <line x1="280" y1="615" x2="800" y2="615" stroke="#f59e0b" stroke-width="1" stroke-opacity="0.4"/>

  <!-- Bottom tag -->
  <text x="540" y="700" font-family="'Courier New', monospace" font-size="26" fill="#94a3b8" text-anchor="middle" letter-spacing="5">DEV · INFRA · SUPORTE</text>
</svg>
