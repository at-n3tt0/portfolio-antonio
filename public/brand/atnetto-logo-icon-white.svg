<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">

<defs>
  <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
    <feGaussianBlur stdDeviation="8" result="blur"/>
    <feColorMatrix in="blur" type="matrix" values="1 0 0 0 1  0 0.55 0 0 0.55  0 0 0 0 0  0 0 0 0.75 0" result="glow"/>
    <feMerge><feMergeNode in="glow"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <linearGradient id="orangeGrad" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#FFB21A"/>
    <stop offset="55%" stop-color="#FF9A00"/>
    <stop offset="100%" stop-color="#E98E0E"/>
  </linearGradient>
</defs>


<g filter="">
  <text x="512" y="630" text-anchor="middle" font-family="Inter Display, Inter, Arial, sans-serif" font-size="545" font-weight="900" letter-spacing="-55" fill="#F5F5F5">at</text>
</g>
</svg>